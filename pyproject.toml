[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstention-quant"
version = "0.1.0"
description = "Compression-aware abstention evaluation for small language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Heavy ML stack. NOTE: pinned separately in requirements-ml.txt; install in a
# Python 3.10-3.12 env -- wheels for torch/auto-gptq/autoawq/bitsandbytes may
# lag on very new interpreters (e.g. 3.14).
ml = [
    "torch",
    "transformers",
    "accelerate",
    "datasets",
    "auto-gptq",
    "autoawq",
    "bitsandbytes",
    "lm-polygraph",
]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
aq = "aq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "experiments"]
testpaths = ["tests"]
